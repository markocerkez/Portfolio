<!doctype html>
<!--
  Generates the social-preview image (assets/og-image.png).
  This is a build-time helper, not part of the live site — it reuses the
  real palette/sprites (so it never goes stale) but its own fixed text,
  never anything from content.js, so a placeholder never ships in a
  shared link preview.

  Regenerate after a palette/sprite change with Playwright, e.g.:
    const { chromium } = require("playwright");
    (async () => {
      const b = await chromium.launch();
      const p = await b.newPage({ viewport: { width: 1200, height: 630 } });
      await p.goto("http://localhost:8080/assets/og-image-source.html");
      await p.screenshot({ path: "assets/og-image.png" });
      await b.close();
    })();
  (serve the repo root first, e.g. `python3 -m http.server 8080`)
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .og__cloud { position: absolute; opacity: 0.95; }
  .og__tree { position: absolute; bottom: 82px; }
  .og__mascot { margin-bottom: 10px; filter: drop-shadow(4px 6px 0 rgba(0,0,0,0.3)); }
  .og__title {
    font-family: var(--font-head);
    color: var(--ink);
    font-size: 58px;
    text-shadow: 5px 5px 0 var(--accent-2);
    margin: 0;
    letter-spacing: 2px;
  }
  .og__subtitle {
    font-family: var(--font-head);
    color: var(--purple);
    font-size: 18px;
    margin-top: 18px;
    letter-spacing: 1px;
  }
  .og__ground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 90px;
    background-image: repeating-linear-gradient(90deg, var(--grass-2) 0 16px, var(--grass-1) 16px 32px);
    border-top: 6px solid var(--dirt);
    box-shadow: inset 0 -70px 0 -10px var(--dirt);
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og__cloud" style="top:50px; left:90px;" id="cloud1"></div>
    <div class="og__cloud" style="top:80px; right:110px;" id="cloud2"></div>
    <div class="og__tree" style="left:70px;" id="tree1"></div>
    <div class="og__tree" style="right:70px;" id="tree2"></div>
    <div class="og__mascot" id="mascot"></div>
    <h1 class="og__title">MARKO CERKEZ</h1>
    <p class="og__subtitle">PIXEL-ART PORTFOLIO // CERKEZ.CH</p>
    <div class="og__ground"></div>
  </div>
<script src="../js/sprites.js"></script>
<script>
  function sprite(name, size) { return pixelSpriteSVG(SPRITES[name], PIXEL_PALETTE, size); }
  function cloudSprite(name, size) { return pixelSpriteSVG(CLOUDS[name], PIXEL_PALETTE, size); }
  document.getElementById("mascot").innerHTML = sprite("blobIdle", 16);
  document.getElementById("tree1").innerHTML = sprite("tree", 10);
  document.getElementById("tree2").innerHTML = sprite("tree", 10);
  document.getElementById("cloud1").innerHTML = cloudSprite("medium", 10);
  document.getElementById("cloud2").innerHTML = cloudSprite("large", 10);
</script>
</body>
</html>
